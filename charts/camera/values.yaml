# Default values for camera (Universal Camera Agent).
# This is a YAML-formatted file.

replicaCount: 1
revisionHistoryLimit: 2

image:
  repository: ghcr.io/big-brother-cctv/camera
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}

securityContext:
  privileged: true
  runAsUser: 0

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: false
  className: "traefik"
  annotations: {}
  hosts:
    - host: camera.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 150m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Mounting local hardware camera device (/dev/video*)
# Set to false if using synthetic 'test' signal or remote IP RTSP camera
hardwareDevice:
  enabled: true
  hostPath: /dev/video0
  mountPath: /dev/video0

# Environment Configuration for Big Brother Camera Agent
configMap:
  enabled: true
  data:
    CAMERA_NAME: "Salon"
    API_URL: "http://api:8080/api"
    MEDIAMTX_URL: "rtsp://mediamtx:8554"
    INTERNAL_TOKEN: "internal-token-pro"
    CONFIG_POLL_INTERVAL: "10"
    CONNECTION_MODE: "push"
    SOURCE_TYPE: "v4l2"
    DEVICE: "/dev/video0"
    RESOLUTION: "1280x720"
    FPS: "25"

# Additional volumes/mounts
volumes: []
volumeMounts: []

nodeSelector:
  kubernetes.io/hostname: rastberry

tolerations: []
affinity: {}
