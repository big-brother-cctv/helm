# Default values for mediamtx (RTSP, RTMP, HLS, WebRTC Streaming Server).
# This is a YAML-formatted file.

replicaCount: 1
revisionHistoryLimit: 2

image:
  repository: bluenviron/mediamtx
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  # LoadBalancer expone directamente los puertos TCP (RTMP 1935, RTSP 8554, HLS 8888) en la IP del host/balanceador,
  # permitiendo la emisión directa desde móviles (OctoStream, Larix), drones y software externo (OBS).
  # Usa "NodePort" o "ClusterIP" según la infraestructura de tu cluster.
  type: LoadBalancer
  annotations: {}
  loadBalancerIP: ""
  ports:
    - name: rtsp
      port: 8554
      targetPort: 8554
      protocol: TCP
      # nodePort: 30554
    - name: rtmp
      port: 1935
      targetPort: 1935
      protocol: TCP
      # nodePort: 31935
    - name: hls
      port: 8888
      targetPort: 8888
      protocol: TCP
      # nodePort: 30888
    - name: webrtc
      port: 8889
      targetPort: 8889
      protocol: TCP
    - name: webrtc-udp
      port: 8189
      targetPort: 8189
      protocol: UDP
    - name: webrtc-tcp
      port: 8189
      targetPort: 8189
      protocol: TCP
    # Playback (descarga de grabaciones): solo interno, lo usa la API para extraer clips
    - name: playback
      port: 9996
      targetPort: 9996
      protocol: TCP
      public: false
    # API de control: NO se publica en el LoadBalancer; va en el Service interno "<fullname>-api"
    - name: api
      port: 9997
      targetPort: 9997
      protocol: TCP
      public: false

ingress:
  # El Ingress maneja exclusivamente el tráfico HTTP/HTTPS para el reproductor web HLS (.m3u8 y fragmentos .ts).
  # Para ingesta directa de vídeo vía RTMP o RTSP, conéctate a través del Service (LoadBalancer / NodePort).
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: "le-cluster-issuer"
  portName: hls
  hosts:
    - host: mediamtx.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - mediamtx.local
      secretName: mediamtx-tls

livenessProbe:
  tcpSocket:
    port: rtsp
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  tcpSocket:
    port: rtsp
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 2

# MediaMTX Environment Configuration
env:
  MTX_API: "yes"
  MTX_API_ADDRESS: ":9997"
  MTX_RTSP: "yes"
  MTX_RTSP_ADDRESS: ":8554"
  MTX_WRITEQUEUESIZE: "4096"
  MTX_READBUFFERCOUNT: "4096"
  MTX_RTMP: "yes"
  MTX_RTMP_ADDRESS: ":1935"
  MTX_HLS: "yes"
  MTX_HLS_ADDRESS: ":8888"
  MTX_HLSSEGMENTDURATION: "1s"
  MTX_HLSPARTDURATION: "200ms"
  MTX_HLSSEGMENTCOUNT: "7"
  MTX_WEBRTC: "yes"
  MTX_WEBRTC_ADDRESS: ":8889"
  MTX_WEBRTCLOCALUDPADDRESS: ":8189"
  MTX_WEBRTCLOCALTCPADDRESS: ":8189"
  MTX_WEBRTCADDITIONALHOSTS: "192.168.1.231,telescreen.local,telescreen.rdvl.net"
  MTX_WEBRTCICESERVERS2_0_URL: "stun:stun.l.google.com:19302"
  MTX_WEBRTCICESERVERS2_1_URL: "stun:stun1.l.google.com:19302"
  MTX_WEBRTCICESERVERS2_2_URL: "stun:stun.cloudflare.com:3478"
  # MediaMTX ya incluye 'all_others:' activo por defecto en su configuración base, permitiendo auto-ingesta (/canal, /iphone, /obs)

# Búfer de grabación para clips de alertas. Se guarda en RAM (emptyDir medium: Memory) para no
# desgastar el disco con escritura continua: ~150 MB por cámara emitiendo (10 min a ~2 Mbit/s).
# La RAM del búfer cuenta para el límite de memoria del pod (ver resources).
recording:
  enabled: true
  deleteAfter: "10m"
  segmentDuration: "10s"
  partDuration: "1s"
  # Tope del tmpfs; si se llena, MediaMTX no puede grabar más hasta que se borren segmentos
  sizeLimit: 600Mi

# Autenticación de MediaMTX
# - http: cada acción se valida contra la API de Big Brother (recomendado).
#   Publicar: rtsp://publisher:<MEDIA_PUBLISH_TOKEN>@host:8554/<cámara>
#             rtmp://host:1935/<cámara>?user=publisher&pass=<MEDIA_PUBLISH_TOKEN>
#   (la clave está en el Secret api-secrets y en el dashboard al añadir una cámara)
# - open: sin autenticación (solo para desarrollo o migración).
auth:
  mode: http
  httpAddress: "http://api:8080/internal/mediamtx/auth"

resources:
  limits:
    cpu: 1000m
    # Incluye el búfer de grabación en RAM (recording.sizeLimit)
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
