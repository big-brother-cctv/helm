# Default values for mediamtx (RTSP, RTMP, HLS, WebRTC Streaming Server).
# This is a YAML-formatted file.

replicaCount: 1
revisionHistoryLimit: 2

image:
  repository: bluenviron/mediamtx
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  ports:
    - name: rtsp
      port: 8554
      targetPort: 8554
      protocol: TCP
    - name: hls
      port: 8888
      targetPort: 8888
      protocol: TCP
    - name: webrtc
      port: 8889
      targetPort: 8889
      protocol: TCP
    - name: api
      port: 9997
      targetPort: 9997
      protocol: TCP
    - name: rtmp
      port: 1935
      targetPort: 1935
      protocol: TCP

ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: "le-cluster-issuer"
  portName: hls
  hosts:
    - host: mediamtx.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - mediamtx.local
      secretName: mediamtx-tls

livenessProbe:
  tcpSocket:
    port: rtsp
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  tcpSocket:
    port: rtsp
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 2

# MediaMTX Environment Configuration
env:
  MTX_API: "yes"
  MTX_API_ADDRESS: ":9997"
  MTX_RTSP_ADDRESS: ":8554"
  MTX_HLS_ADDRESS: ":8888"
  MTX_RTMP_ADDRESS: ":1935"
  MTX_WEBRTC_ADDRESS: ":8889"
  MTX_AUTHINTERNALUSERS_0_USER: "any"
  MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_ACTION: "api"
  MTX_AUTHINTERNALUSERS_0_PERMISSIONS_1_ACTION: "read"
  MTX_AUTHINTERNALUSERS_0_PERMISSIONS_2_ACTION: "publish"

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
