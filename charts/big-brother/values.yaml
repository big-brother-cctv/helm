# Big Brother CCTV Umbrella Chart - Default Values
# Controls deployment of all microservices in the Big Brother ecosystem

global:
  environment: production
  imagePullSecrets: []

# PostgreSQL Database
# fullnameOverride: las imágenes y los charts esperan nombres de servicio fijos
# (api, mediamtx, mediamtx-api, postgres, api-secrets), igual que con un release por componente.
postgres:
  enabled: true
  fullnameOverride: postgres
  image:
    tag: "16-alpine"
  persistence:
    enabled: true
    size: 10Gi
  configMap:
    enabled: true
    data:
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin"
      POSTGRES_DB: "bigbrother"
      PGDATA: "/var/lib/postgresql/data/pgdata"

# MediaMTX Streaming Server (RTSP, RTMP, HLS, WebRTC)
mediamtx:
  enabled: true
  fullnameOverride: mediamtx

# Big Brother Core Go API
api:
  enabled: true
  fullnameOverride: api
  persistence:
    enabled: true
    size: 10Gi
    mountPath: /app/data
  config:
    port: "8080"
    dbHost: "postgres"
    dbPort: "5432"
    dbUser: "admin"
    dbName: "bigbrother"
    dbSslMode: "disable"
  # JWT_SECRET e INTERNAL_TOKEN se generan en el Secret "api-secrets"
  # (o usa secrets.existingSecret). Ver helm/charts/api/values.yaml
  secrets:
    existingSecret: ""
    mediamtxApiUrl: "http://mediamtx:9997"
    mediamtxRtspHost: "mediamtx"

# Telescreen Web Dashboard (React 19 + HLS.js)
telescreen:
  enabled: true
  fullnameOverride: telescreen
  ingress:
    enabled: true
    className: "traefik"
    hosts:
      - host: telescreen.local
        paths:
          - path: /
            pathType: Prefix

# Motion Detector Microservice (Local Snapshot Ingestion & Realtime Alerts)
motion-detector:
  enabled: true
  fullnameOverride: motion-detector
  config:
    apiUrl: "http://api:8080/api/alerts"
    # Secret creado por el subchart api (fullnameOverride: api -> "api-secrets")
    internalTokenSecret:
      name: "api-secrets"
      key: "INTERNAL_TOKEN"
    cooldownSeconds: "15"
    discordWebhook: ""

# Camera Agent (Physical USB /dev/video* or synthetic signal - disabled by default in cloud k8s)
camera:
  enabled: false
  fullnameOverride: camera
