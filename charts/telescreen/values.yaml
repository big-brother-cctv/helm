# Default values for telescreen (React 19 + Nginx Dashboard).
# This is a YAML-formatted file.

replicaCount: 1
revisionHistoryLimit: 2

image:
  repository: ghcr.io/big-brother-cctv/telescreen
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "cloudflare-tunnel"
  annotations: {}
  hosts:
    - host: telescreen.rdvl.net
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: telescreen-tls
      hosts:
        - telescreen.rdvl.net

ingressLocal:
  enabled: true
  name: "telescreen-local"
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: "le-cluster-issuer"
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
  hosts:
    - host: telescreen.rdvl.net
      paths:
        - path: /
          pathType: Prefix
    - host: telescreen.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: telescreen-local-tls
      hosts:
        - telescreen.rdvl.net

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 2

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 30m
    memory: 32Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

configMap:
  enabled: false
  data: {}

nodeSelector: {}
tolerations: []
affinity: {}
