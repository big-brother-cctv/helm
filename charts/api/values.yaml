# Default values for api (Go Backend).
# This is a YAML-formatted file.

replicaCount: 1
revisionHistoryLimit: 2

image:
  repository: ghcr.io/big-brother-cctv/api
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  hosts:
    - host: api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

livenessProbe:
  httpGet:
    path: /actuator/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 2

# Go Application Environment Variables
config:
  port: "8080"
  dbHost: "postgres"
  dbPort: "5432"
  dbUser: "admin"
  dbName: "bigbrother"
  dbSslMode: "disable"
  appEnv: "production"
  # Zona horaria de la API (hora que aparece en las notificaciones push)
  timezone: "Europe/Madrid"
  # Web Push: las claves VAPID se generan solas y se guardan en la BD. "subject" debe ser una URL
  # https o un mailto: identificable (Apple rechaza valores inválidos).
  vapidSubject: ""
  # Retención de alertas y snapshots (0 = sin límite). El PVC suele compartir disco con otros servicios.
  alertRetentionDays: 30
  alertMaxStorageMB: 2048
  # Auto-registro público (POST /api/auth/register). Si se activa, solo crea usuarios "viewer".
  allowRegistration: false
  contentManagerUrl: "http://content-manager:8181"
  # Service ClusterIP interno del chart mediamtx (la API de control ya no se publica en el LoadBalancer)
  mediamtxApiUrl: "http://mediamtx-api:9997"
  mediamtxRtspHost: "mediamtx"

# Secretos de la API (se guardan en un Secret, nunca en el ConfigMap).
# - existingSecret: usa un Secret creado fuera del chart (claves: JWT_SECRET, INTERNAL_TOKEN,
#   DB_PASSWORD y opcional ADMIN_INITIAL_PASSWORD). Recomendado con GitOps/SealedSecrets.
# - Si no, el chart crea "<fullname>-secrets". Los valores vacíos se conservan del Secret
#   existente o se generan aleatoriamente en la primera instalación.
# motion-detector y camera leen INTERNAL_TOKEN de este Secret.
secrets:
  existingSecret: ""
  jwtSecret: ""
  internalToken: ""
  # Credenciales de MediaMTX (authMethod: http contra /internal/mediamtx/auth):
  # - mediaPublishToken: clave para publicar desde móviles/OBS (usuario "publisher")
  # - mediaReadToken: clave de lectura para motion-detector y el nginx de Telescreen (usuario "reader")
  mediaPublishToken: ""
  mediaReadToken: ""
  # Debe coincidir con POSTGRES_PASSWORD del chart postgres (vacío = "admin", el valor histórico)
  dbPassword: ""
  # Password del usuario "admin" al crear una BD vacía. Vacío = se genera y se imprime en el log.
  adminInitialPassword: ""

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# Persistent storage for alert snapshots and uploaded data
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /app/data

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

