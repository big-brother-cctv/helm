{{- if not .Values.secrets.existingSecret }}
{{- /*
Secretos de la API. Si un valor no se define en values, se reutiliza el existente en el
clúster (lookup) y, si no existe, se genera uno aleatorio. Así los upgrades no rotan los
secretos y nunca se despliegan valores por defecto conocidos.
Otros charts (motion-detector, camera) leen INTERNAL_TOKEN de este mismo Secret.
Compatibilidad: config.jwtSecret / config.internalToken / config.dbPassword (values antiguos) se respetan.
*/ -}}
{{- $name := include "api.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $data := dict }}
{{- if $existing }}{{- $data = $existing.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
  annotations:
    # No borrar el Secret al desinstalar: perderlo invalida sesiones y desconecta los agentes
    helm.sh/resource-policy: keep
type: Opaque
data:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default .Values.config.jwtSecret | default (get $data "JWT_SECRET" | default "" | b64dec) | default (randAlphaNum 64) | b64enc | quote }}
  INTERNAL_TOKEN: {{ .Values.secrets.internalToken | default .Values.config.internalToken | default (get $data "INTERNAL_TOKEN" | default "" | b64dec) | default (randAlphaNum 48) | b64enc | quote }}
  {{- $read := .Values.secrets.mediaReadToken | default (get $data "MEDIA_READ_TOKEN" | default "" | b64dec) | default (randAlphaNum 48) }}
  MEDIA_PUBLISH_TOKEN: {{ .Values.secrets.mediaPublishToken | default (get $data "MEDIA_PUBLISH_TOKEN" | default "" | b64dec) | default (randAlphaNum 32) | b64enc | quote }}
  MEDIA_READ_TOKEN: {{ $read | b64enc | quote }}
  # base64("reader:<MEDIA_READ_TOKEN>") para la cabecera Basic que el nginx de Telescreen envía a MediaMTX
  MEDIA_READ_BASIC: {{ printf "reader:%s" $read | b64enc | b64enc | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | default .Values.config.dbPassword | default (get $data "DB_PASSWORD" | default "" | b64dec) | default "admin" | b64enc | quote }}
  {{- with (.Values.secrets.adminInitialPassword | default (get $data "ADMIN_INITIAL_PASSWORD" | default "" | b64dec)) }}
  ADMIN_INITIAL_PASSWORD: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
