apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api.fullname" . }}-config
  labels:
    {{- include "api.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.config.port | default "8080" | quote }}
  DB_HOST: {{ .Values.config.dbHost | default "postgres" | quote }}
  DB_PORT: {{ .Values.config.dbPort | default "5432" | quote }}
  DB_USER: {{ .Values.config.dbUser | default "admin" | quote }}
  DB_NAME: {{ .Values.config.dbName | default "bigbrother" | quote }}
  DB_SSLMODE: {{ .Values.config.dbSslMode | default "disable" | quote }}
  APP_ENV: {{ .Values.config.appEnv | default "production" | quote }}
  ALLOW_REGISTRATION: {{ .Values.config.allowRegistration | default false | toString | quote }}
  CONTENT_MANAGER_URL: {{ .Values.config.contentManagerUrl | default "http://content-manager:8181" | quote }}
  MEDIAMTX_API_URL: {{ .Values.config.mediamtxApiUrl | default "http://mediamtx:9997" | quote }}
  MEDIAMTX_RTSP_HOST: {{ .Values.config.mediamtxRtspHost | default "mediamtx" | quote }}
  DATA_DIR: {{ .Values.persistence.mountPath | default "/app/data" | quote }}
  ALERTS_DIR: {{ printf "%s/alerts" (.Values.persistence.mountPath | default "/app/data") | quote }}
