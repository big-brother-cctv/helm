apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "motion-detector.fullname" . }}
  labels:
    {{- include "motion-detector.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "motion-detector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "motion-detector.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "motion-detector.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "motion-detector.fullname" . }}-config
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /tmp/motion_images /tmp/motion/conf.d /etc/motion/models
              if [ -f /etc/motion/on_picture_save.sh ]; then
                cp /etc/motion/on_picture_save.sh /usr/local/bin/on_picture_save.sh
                chmod +x /usr/local/bin/on_picture_save.sh
              fi
              if [ -f /etc/motion/entrypoint.sh ]; then
                cp /etc/motion/entrypoint.sh /usr/local/bin/entrypoint.sh
                chmod +x /usr/local/bin/entrypoint.sh
              fi
              if [ -f /etc/motion/detect_objects.py ]; then
                cp /etc/motion/detect_objects.py /usr/local/bin/detect_objects.py
                chmod +x /usr/local/bin/detect_objects.py
              fi
              if ! which python3 >/dev/null 2>&1; then
                echo "[INIT] Instalando dependencias de IA..."
                apt-get update && apt-get install -y --no-install-recommends python3 python3-numpy python3-pil python3-pip && \
                pip install --no-cache-dir --break-system-packages onnxruntime || true
              fi
              if [ ! -f /etc/motion/models/yolov8n.onnx ] || [ $(wc -c < /etc/motion/models/yolov8n.onnx 2>/dev/null || echo 0) -lt 1000000 ]; then
                echo "[INIT] Descargando modelo YOLOv8n ONNX..."
                curl -sSL -o /etc/motion/models/yolov8n.onnx https://huggingface.co/unity/inference-engine-yolo/resolve/ed7f4daf9263d0d31be1d60b9d67c8baea721d60/yolov8n.onnx || true
              fi
              exec /usr/local/bin/entrypoint.sh
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: motion-conf
              mountPath: /etc/motion/entrypoint.sh
              subPath: entrypoint.sh
            - name: motion-conf
              mountPath: /etc/motion/on_picture_save.sh
              subPath: on_picture_save.sh
            - name: motion-conf
              mountPath: /etc/motion/detect_objects.py
              subPath: detect_objects.py
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: motion-conf
          configMap:
            name: {{ include "motion-detector.fullname" . }}-config
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
