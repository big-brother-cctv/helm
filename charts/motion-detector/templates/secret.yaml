{{- if or .Values.config.internalToken .Values.config.discordWebhook }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "motion-detector.fullname" . }}-secrets
  labels:
    {{- include "motion-detector.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with .Values.config.internalToken }}
  INTERNAL_TOKEN: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.config.discordWebhook }}
  DISCORD_WEBHOOK: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
