apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "motion-detector.fullname" . }}-config
  labels:
    {{- include "motion-detector.labels" . | nindent 4 }}
data:
  API_URL: {{ .Values.config.apiUrl | default "http://api:8080/api/alerts" | quote }}
  INTERNAL_TOKEN: {{ .Values.config.internalToken | default "internal-token-pro" | quote }}
  CAMERA_NAME: {{ .Values.config.cameraName | default "camera" | quote }}
  COOLDOWN_SECONDS: {{ .Values.config.cooldownSeconds | default "15" | quote }}
  DISCORD_WEBHOOK: {{ .Values.config.discordWebhook | default "" | quote }}
  NETCAM_URL: {{ .Values.config.rtspUrl | default "rtsp://mediamtx:8554/stream" | quote }}
  motion.conf: |
    daemon off
    stream_localhost off
    netcam_url {{ .Values.config.rtspUrl | default "rtsp://mediamtx:8554/stream" }}
    width {{ .Values.config.width | default 1280 }}
    height {{ .Values.config.height | default 720 }}
    framerate {{ .Values.config.framerate | default 30 }}

    picture_output on
    output_pictures best
    picture_filename %Y-%m-%d_%H-%M-%S
    target_dir /tmp/motion_images

    on_picture_save /usr/local/bin/on_picture_save.sh %f

    camera_name {{ .Values.config.cameraName | default "camera" }}
    threshold {{ .Values.config.threshold | default 800 }}
    sensitivity {{ .Values.config.sensitivity | default 30 }}
    noise {{ .Values.config.noise | default 5 }}
    notification_timeout 60
    min_motion_frames 5
    gap 10
    movie_output off
  on_picture_save.sh: |
    #!/bin/bash
    FILE=$1
    COOLDOWN_FILE="/tmp/motion_last_notification"
    COOLDOWN_SECONDS="${COOLDOWN_SECONDS:-15}"
    API_URL="${API_URL:-http://api:8080/api/alerts}"
    INTERNAL_TOKEN="${INTERNAL_TOKEN:-internal-token-pro}"
    CAMERA_NAME="${CAMERA_NAME:-camera}"

    if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
      exit 0
    fi

    now=$(date +%s)
    last=$(cat "$COOLDOWN_FILE" 2>/dev/null || echo 0)
    diff=$((now - last))

    if [ "$diff" -ge "$COOLDOWN_SECONDS" ]; then
      echo "Enviando snapshot a Big Brother API: $API_URL"
      curl -s -F "image=@${FILE}" \
           -F "camera_name=${CAMERA_NAME}" \
           -F "label=motion" \
           -F "token=${INTERNAL_TOKEN}" \
           "$API_URL"

      if [ -n "$DISCORD_WEBHOOK" ]; then
        curl -s -F "file=@${FILE}" \
             -F "content=🚨 Movimiento detectado en ${CAMERA_NAME}! 📸" \
             "$DISCORD_WEBHOOK" >/dev/null 2>&1 || true
      fi

      echo "$now" > "$COOLDOWN_FILE"
    else
      echo "Alerta omitida (cooldown: ${diff}s transcurridos, requiere ${COOLDOWN_SECONDS}s)"
    fi

    # Limpieza periódica de fotos antiguas en /tmp/motion_images (>10 minutos)
    find /tmp/motion_images -name "*.jpg" -mmin +10 -delete 2>/dev/null || true
