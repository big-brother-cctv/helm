apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "motion-detector.fullname" . }}-config
  labels:
    {{- include "motion-detector.labels" . | nindent 4 }}
data:
  API_URL: {{ .Values.config.apiUrl | default "http://api:8080/api/alerts" | quote }}
  INTERNAL_TOKEN: {{ .Values.config.internalToken | default "internal-token-pro" | quote }}
  CAMERA_NAME: {{ .Values.config.cameraName | default "camera" | quote }}
  COOLDOWN_SECONDS: {{ .Values.config.cooldownSeconds | default "15" | quote }}
  DISCORD_WEBHOOK: {{ .Values.config.discordWebhook | default "" | quote }}
  NETCAM_URL: {{ .Values.config.rtspUrl | default "rtsp://mediamtx:8554/stream" | quote }}
  entrypoint.sh: |
    #!/bin/sh
    set -e

    mkdir -p /tmp/motion_images /tmp/motion/conf.d

    API_URL="${API_URL:-http://api:8080/api/alerts}"
    API_BASE=$(echo "$API_URL" | sed 's|/api/alerts.*||')
    CONFIG_URL="${API_BASE}/api/motion/config"

    generate_configs() {
      json="$1"
      rm -f /tmp/motion/conf.d/*.conf

      cat <<EOF > /tmp/motion.conf
    daemon off
    stream_localhost off
    webcontrol_port 8083
    webcontrol_localhost off
    picture_output best
    event_gap 10
    movie_output off
    camera_dir /tmp/motion/conf.d
    framerate 10
    netcam_params rtsp_transport=tcp
    noise_level 32
    noise_tune on
    despeckle_filter EedDl
    picture_quality 85
    EOF

      configured=0
      if [ -n "$json" ] && which jq >/dev/null 2>&1; then
        count=$(echo "$json" | jq -r '.cameras | length' 2>/dev/null || echo 0)
        if [ "$count" -gt 0 ]; then
          i=0
          while [ "$i" -lt "$count" ]; do
            cam_name=$(echo "$json" | jq -r ".cameras[$i].name // empty")
            cam_id=$(echo "$json" | jq -r ".cameras[$i].id // ($i + 1)")
            rtsp_url=$(echo "$json" | jq -r ".cameras[$i].rtspUrl // empty")
            cam_res=$(echo "$json" | jq -r ".cameras[$i].resolution // empty")
            threshold=$(echo "$json" | jq -r ".cameras[$i].threshold // 350")
            frames=$(echo "$json" | jq -r ".cameras[$i].frames // 2")
            enabled=$(echo "$json" | jq -r ".cameras[$i].enabled // true")

            if [ "$enabled" = "true" ] && [ -n "$cam_name" ]; then
              mkdir -p "/tmp/motion_images/${cam_name}"
              
              if [ -z "$cam_res" ] && which ffprobe >/dev/null 2>&1; then
                cam_res=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "${rtsp_url}" 2>/dev/null | tail -n 1 || true)
              fi

              res_config=""
              if echo "$cam_res" | grep -q '^[0-9]\+x[0-9]\+$'; then
                w=$(echo "$cam_res" | cut -d'x' -f1)
                h=$(echo "$cam_res" | cut -d'x' -f2)
                res_config="width ${w}
    height ${h}"
              fi

              cat <<CAM_EOF > "/tmp/motion/conf.d/camera_${cam_name}.conf"
    camera_id ${cam_id}
    camera_name ${cam_name}
    target_dir /tmp/motion_images/${cam_name}
    picture_filename ${cam_name}_%Y-%m-%d_%H-%M-%S
    netcam_url ${rtsp_url}
    framerate 10
    netcam_params rtsp_transport=tcp
    threshold ${threshold}
    minimum_motion_frames ${frames}
    picture_output best
    on_picture_save /usr/local/bin/on_picture_save.sh %f ${cam_name}
    CAM_EOF
              echo "[MOTION] Cámara unificada configurada: ${cam_name} (ID: ${cam_id}, ${rtsp_url}, res: nativa) - Umbral: ${threshold}px, 30fps"
              configured=$((configured + 1))
            fi
            i=$((i + 1))
          done
        fi
      fi

      if [ "$configured" -eq 0 ]; then
        DEFAULT_NAME="${CAMERA_NAME:-camera}"
        DEFAULT_URL="${NETCAM_URL:-${STREAM_URL:-rtsp://mediamtx:8554/${DEFAULT_NAME}}}"
        mkdir -p "/tmp/motion_images/${DEFAULT_NAME}"
        cat <<DEF_EOF > "/tmp/motion/conf.d/camera_${DEFAULT_NAME}.conf"
    camera_id 1
    camera_name ${DEFAULT_NAME}
    target_dir /tmp/motion_images/${DEFAULT_NAME}
    picture_filename ${DEFAULT_NAME}_%Y-%m-%d_%H-%M-%S
    netcam_url ${DEFAULT_URL}
    framerate 10
    netcam_params rtsp_transport=tcp
    threshold ${THRESHOLD:-350}
    minimum_motion_frames ${MIN_MOTION_FRAMES:-2}
    picture_output best
    on_picture_save /usr/local/bin/on_picture_save.sh %f ${DEFAULT_NAME}
    DEF_EOF
        echo "[MOTION] Modo fallback/local: ${DEFAULT_NAME} (${DEFAULT_URL})"
      fi
    }

    echo "=========================================================="
    echo "[MOTION DETECTOR] Daemon Centralizado Unificado Multi-Cámara"
    echo "[MOTION DETECTOR] Consultando API: ${CONFIG_URL}"
    echo "=========================================================="

    RESP=""
    for attempt in 1 2 3 4 5; do
      RESP=$(curl -s --connect-timeout 2 "${CONFIG_URL}" 2>/dev/null || true)
      if [ -n "$RESP" ]; then
        break
      fi
      sleep 1
    done

    generate_configs "$RESP"

    # Sincronizador en segundo plano: detecta nuevas cámaras en caliente cada 10 segundos
    (
      LAST_HASH=$(echo "$RESP" | md5sum 2>/dev/null | awk '{print $1}')
      while true; do
        sleep 10
        NEW_RESP=$(curl -s --connect-timeout 3 "${CONFIG_URL}" 2>/dev/null || true)
        if [ -n "$NEW_RESP" ]; then
          NEW_HASH=$(echo "$NEW_RESP" | md5sum 2>/dev/null | awk '{print $1}')
          if [ -n "$LAST_HASH" ] && [ "$NEW_HASH" != "$LAST_HASH" ]; then
            echo "[MOTION DETECTOR] Cambio detectado en cámaras o configuración. Reconfigurando en caliente..."
            generate_configs "$NEW_RESP"
            curl -s http://127.0.0.1:8083/0/action/restart >/dev/null 2>&1 || true
          fi
          LAST_HASH="$NEW_HASH"
        fi
      done
    ) &

    exec motion -n -c /tmp/motion.conf
  on_picture_save.sh: |
    #!/bin/bash
    FILE=$1
    CAMERA_NAME="${2:-${CAMERA_NAME:-camera}}"
    COOLDOWN_FILE="/tmp/motion_last_notification_${CAMERA_NAME}"
    COOLDOWN_SECONDS="${COOLDOWN_SECONDS:-15}"
    API_URL="${API_URL:-http://api:8080/api/alerts}"
    INTERNAL_TOKEN="${INTERNAL_TOKEN:-internal-token-pro}"

    if [ -z "$FILE" ] || [ ! -f "$FILE" ] || [ ! -s "$FILE" ]; then
      exit 0
    fi

    # Validar tamaño mínimo de archivo (descartar JPEGs corruptos o truncados < 4KB)
    FILE_SIZE=$(wc -c < "$FILE" 2>/dev/null || echo 0)
    if [ "$FILE_SIZE" -lt 4000 ]; then
      echo "[DISCARD] Snapshot demasiado pequeño o corrupto (${FILE_SIZE} bytes): $FILE"
      rm -f "$FILE"
      exit 0
    fi

    # Detectar y descartar fotogramas verdes o negros producidos por anomalías del decodificador H.264
    if which ffmpeg >/dev/null 2>&1 && which od >/dev/null 2>&1; then
      RGB=$(ffmpeg -nostdin -v error -i "$FILE" -vf "scale=1:1" -f rawvideo -pix_fmt rgb24 - 2>/dev/null | od -An -t u1 2>/dev/null)
      if [ -n "$RGB" ]; then
        set -- $RGB
        r=${1:-0}
        g=${2:-0}
        b=${3:-0}
        # YUV=0/sin sincronizar decodifica exactamente a R=0 G=138 B=0 (verde digital sólido)
        if [ "$r" -lt 25 ] && [ "$b" -lt 25 ] && [ "$g" -gt 60 ]; then
          echo "[DISCARD] Fotograma verde de artefacto digital descartado para [${CAMERA_NAME}] ($FILE - RGB: $r,$g,$b)"
          rm -f "$FILE"
          exit 0
        fi
        # Fotograma completamente negro (< 4 en todos los canales)
        if [ "$r" -lt 4 ] && [ "$g" -lt 4 ] && [ "$b" -lt 4 ]; then
          echo "[DISCARD] Fotograma negro vacío descartado para [${CAMERA_NAME}] ($FILE)"
          rm -f "$FILE"
          exit 0
        fi

        # Detectar y descartar bandas verticales / smear por pérdida de paquetes H.264 (filas inferiores casi idénticas)
        ROWS=$(ffmpeg -nostdin -v error -i "$FILE" -vf "scale=1:5" -f rawvideo -pix_fmt gray - 2>/dev/null | od -An -t u1 2>/dev/null)
        if [ -n "$ROWS" ]; then
          set -- $ROWS
          y1=${1:-0}; y2=${2:-0}; y3=${3:-0}; y4=${4:-0}; y5=${5:-0}
          d23=$(( y2 > y3 ? y2 - y3 : y3 - y2 ))
          d34=$(( y3 > y4 ? y3 - y4 : y4 - y3 ))
          d45=$(( y4 > y5 ? y4 - y5 : y5 - y4 ))
          if [ "$d23" -eq 0 ] && [ "$d34" -eq 0 ] && [ "$d45" -eq 0 ]; then
            echo "[DISCARD] Fotograma con barrido vertical (smear/macroblocks corruptos) descartado para [${CAMERA_NAME}] ($FILE - Rows: $y1 $y2 $y3 $y4 $y5)"
            rm -f "$FILE"
            exit 0
          fi
        fi

        # Detectar y descartar artefactos cromáticos por pérdida de macroblocks H.264 (bandas magenta/rosa o verde fosforito en bordes)
        EDGE_RGB=$(ffmpeg -nostdin -v error -i "$FILE" -vf "split=2[l][r]; [l]crop=in_w*0.2:in_h:0:0,scale=1:2[l2]; [r]crop=in_w*0.2:in_h:in_w*0.8:0,scale=1:2[r2]; [l2][r2]vstack" -f rawvideo -pix_fmt rgb24 - 2>/dev/null | od -An -t u1 2>/dev/null)
        if [ -n "$EDGE_RGB" ]; then
          set -- $EDGE_RGB
          while [ $# -ge 3 ]; do
            cr=$1; cg=$2; cb=$3
            shift 3
            # Ruido magenta/rosa por desincronización de crominancia U/V
            if [ "$cr" -gt 50 ] && [ "$cr" -gt $(( cg * 3 / 2 )) ] && [ "$cb" -gt $(( cg * 11 / 10 )) ]; then
              echo "[DISCARD] Fotograma con corrupción cromática magenta/rosa descartado para [${CAMERA_NAME}] ($FILE - RGB: $cr,$cg,$cb)"
              rm -f "$FILE"
              exit 0
            fi
            # Ruido verde por decodificación YUV fuera de rango
            if [ "$cg" -gt 60 ] && [ "$cg" -gt $(( cr * 3 / 2 )) ] && [ "$cg" -gt $(( cb * 3 / 2 )) ]; then
              echo "[DISCARD] Fotograma con corrupción cromática verde descartado para [${CAMERA_NAME}] ($FILE - RGB: $cr,$cg,$cb)"
              rm -f "$FILE"
              exit 0
            fi
          done
        fi

        # Detectar y descartar barridos / smears verticales de pérdida de paquetes (columnas idénticas de arriba a abajo)
        GRID_3X3=$(ffmpeg -nostdin -v error -i "$FILE" -vf "scale=3:3" -f rawvideo -pix_fmt gray - 2>/dev/null | od -An -t u1 2>/dev/null)
        if [ -n "$GRID_3X3" ]; then
          set -- $GRID_3X3
          r11=${1:-0}; r12=${2:-0}; r13=${3:-0}
          r21=${4:-0}; r22=${5:-0}; r23=${6:-0}
          r31=${7:-0}; r32=${8:-0}; r33=${9:-0}
          d1=$(( r11 > r31 ? r11 - r31 : r31 - r11 ))
          d2=$(( r12 > r32 ? r12 - r32 : r32 - r12 ))
          d3=$(( r13 > r33 ? r13 - r33 : r33 - r13 ))
          total_v_delta=$(( d1 + d2 + d3 ))
          if [ "$total_v_delta" -le 8 ] || { [ "$d1" -le 4 ] && [ "$d2" -le 4 ] && [ "$d3" -le 4 ]; }; then
            echo "[DISCARD] Fotograma con barrido vertical (smear sin variación en columnas) descartado para [${CAMERA_NAME}] ($FILE - Deltas: $d1 $d2 $d3 Total: $total_v_delta)"
            rm -f "$FILE"
            exit 0
          fi
        fi
      fi
    fi

    now=$(date +%s)
    last=$(cat "$COOLDOWN_FILE" 2>/dev/null || echo 0)
    diff=$((now - last))

    if [ "$diff" -ge "$COOLDOWN_SECONDS" ]; then
      AI_ENABLED="${AI_ENABLED:-true}"
      LABEL="motion"

      if [ "$AI_ENABLED" = "true" ] && which python3 >/dev/null 2>&1 && [ -f /usr/local/bin/detect_objects.py ]; then
        AI_OUTPUT=$(python3 /usr/local/bin/detect_objects.py "$FILE" 2>/dev/null)
        AI_STATUS=$?

        if [ "$AI_STATUS" -eq 1 ]; then
          echo "[AI FILTER] Snapshot descartado para [${CAMERA_NAME}]: No se detectó ninguna persona o vehículo relevante."
          rm -f "$FILE"
          exit 0
        elif [ "$AI_STATUS" -eq 0 ]; then
          DETECTED_LABEL=$(echo "$AI_OUTPUT" | grep "^LABEL=" | cut -d= -f2-)
          if [ -n "$DETECTED_LABEL" ]; then
            LABEL="$DETECTED_LABEL"
            echo "[AI FILTER] ¡Objetivo confirmado para [${CAMERA_NAME}]!: $LABEL"
          fi
        fi
      fi

      echo "Enviando snapshot de [${CAMERA_NAME}] ($FILE) [Label: ${LABEL}] a Big Brother API: $API_URL"
      curl -s -F "image=@${FILE}" \
           -F "camera_name=${CAMERA_NAME}" \
           -F "label=${LABEL}" \
           -F "token=${INTERNAL_TOKEN}" \
           "$API_URL"

      if [ -n "$DISCORD_WEBHOOK" ]; then
        curl -s -F "file=@${FILE}" \
             -F "content=🚨 Alerta de Seguridad [${CAMERA_NAME}] - Detectado: **${LABEL}** 📸" \
             "$DISCORD_WEBHOOK" >/dev/null 2>&1 || true
      fi

      echo "$now" > "$COOLDOWN_FILE"
    else
      echo "Alerta de [${CAMERA_NAME}] omitida (cooldown: ${diff}s transcurridos, requiere ${COOLDOWN_SECONDS}s)"
    fi

    # Limpiar de inmediato el fichero temporal procesado para no acumular basura en disco
    rm -f "$FILE"

    # Limpieza de seguridad de posibles ficheros residuales antiguos (>2 minutos)
    find /tmp/motion_images -type f -name "*.jpg" -mmin +2 -delete 2>/dev/null || true
  detect_objects.py: |
    #!/usr/bin/env python3
    import sys
    import os
    import numpy as np
    from PIL import Image

    MODEL_PATH = os.environ.get("AI_MODEL_PATH", "/etc/motion/models/yolov8n.onnx")
    CONF_THRESHOLD = float(os.environ.get("AI_CONF_THRESHOLD", "0.28"))
    TARGET_CLASSES = os.environ.get(
        "AI_TARGET_CLASSES", "person,car,truck,bus,motorcycle,bicycle,dog,cat"
    ).lower().split(",")

    COCO_CLASSES = [
        "person", "bicycle", "car", "motorcycle", "airplane", "bus", "train", "truck", "boat",
        "traffic light", "fire hydrant", "stop sign", "parking meter", "bench", "bird", "cat",
        "dog", "horse", "sheep", "cow", "elephant", "bear", "zebra", "giraffe", "backpack",
        "umbrella", "handbag", "tie", "suitcase", "frisbee", "skis", "snowboard", "sports ball",
        "kite", "baseball bat", "baseball glove", "skateboard", "surfboard", "tennis racket",
        "bottle", "wine glass", "cup", "fork", "knife", "spoon", "bowl", "banana", "apple",
        "sandwich", "orange", "broccoli", "carrot", "hot dog", "pizza", "donut", "cake", "chair",
        "couch", "potted plant", "bed", "dining table", "toilet", "tv", "laptop", "mouse",
        "remote", "keyboard", "cell phone", "microwave", "oven", "toaster", "sink",
        "refrigerator", "book", "clock", "vase", "scissors", "teddy bear", "hair drier", "toothbrush"
    ]

    def detect(image_path: str):
        if not os.path.exists(image_path):
            return True, "motion"

        if not os.path.exists(MODEL_PATH):
            sys.stderr.write(f"[AI] Model file not found at {MODEL_PATH}, bypassing AI filter.\n")
            return True, "motion"

        try:
            import onnxruntime as ort

            opts = ort.SessionOptions()
            opts.intra_op_num_threads = 2
            opts.inter_op_num_threads = 1
            opts.graph_optimization_level = ort.GraphOptimizationLevel.ORT_ENABLE_ALL

            session = ort.InferenceSession(
                MODEL_PATH,
                sess_options=opts,
                providers=["CPUExecutionProvider"]
            )
            input_meta = session.get_inputs()[0]
            input_type = input_meta.type
            dtype = np.float16 if "float16" in input_type else np.float32

            img = Image.open(image_path).convert("RGB")
            w, h = img.size
            scale = min(640 / w, 640 / h)
            new_w, new_h = max(1, int(w * scale)), max(1, int(h * scale))
            img_resized = img.resize((new_w, new_h), Image.Resampling.BILINEAR)
            letterbox = Image.new("RGB", (640, 640), (114, 114, 114))
            letterbox.paste(img_resized, ((640 - new_w) // 2, (640 - new_h) // 2))
            img_data = (np.array(letterbox, dtype=np.float32) / 255.0).astype(dtype)
            img_data = np.transpose(img_data, (2, 0, 1))
            input_tensor = np.expand_dims(img_data, axis=0)

            outputs = session.run(None, {input_meta.name: input_tensor})
            predictions = outputs[0]

            preds = predictions[0].T.astype(np.float32)
            scores = preds[:, 4:]

            class_ids = np.argmax(scores, axis=1)
            confidences = np.max(scores, axis=1)

            target_indices = [
                i for i, name in enumerate(COCO_CLASSES) if name in TARGET_CLASSES
            ]
            mask = (confidences >= CONF_THRESHOLD) & np.isin(class_ids, target_indices)

            if not np.any(mask):
                return False, "no_target"

            best_idx = np.argmax(confidences * mask)
            best_class = COCO_CLASSES[class_ids[best_idx]]
            best_conf = float(confidences[best_idx])
            label = f"{best_class} ({int(best_conf * 100)}%)"
            return True, label

        except Exception as e:
            sys.stderr.write(f"[AI] Error during detection: {e}\n")
            return True, "motion"

    if __name__ == "__main__":
        if len(sys.argv) < 2:
            print("Usage: detect_objects.py <image_path>")
            sys.exit(2)

        image_path = sys.argv[1]
        has_target, label = detect(image_path)
        if has_target:
            print(f"LABEL={label}")
            sys.exit(0)
        else:
            print("NO_TARGET")
            sys.exit(1)
