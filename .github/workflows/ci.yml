name: CI - Helm Charts

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'charts/**'
      - '.github/workflows/**'

jobs:
  lint-and-template:
    name: Lint & Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Resolve umbrella dependencies
        run: helm dependency update charts/big-brother

      - name: Lint charts
        run: helm lint charts/*/

      - name: Render charts
        run: |
          for chart in charts/*/; do
            echo "::group::$chart"
            helm template ci "$chart" --namespace ci > /dev/null
            echo "::endgroup::"
          done
